const joinTeam=(p,postId,userId)=>{const post=p.posts.find(x=>x.id===postId);if(!post)return p;let team=p.teams.find(t=>t.postId===postId);let teams=p.teams;

 <header className="mx-auto flex max-w-6xl items-center justify-between p-4"><div className="text-xl font-extrabold text-indigo-700">Skill<span className="text-violet-500">Sync</span></div><div className="flex gap-2"><button className="btn2" onClick={()=>go('/login')}>Log in</button><button className="btn" onClick={()=>go('/register')}>Create account</button></div></header>
 <main className="mx-auto max-w-4xl px-4 pb-20 pt-20 text-center sm:pt-28"><h1 className="text-4xl font-extrabold leading-tight tracking-tight text-slate-900 sm:text-6xl">From Ideas to Collaboration to Innovation.</h1>
 
 <div className="mt-10 flex flex-wrap justify-center gap-3"><button className="btn !px-6 !py-3" onClick={()=>go('/roles')}>Try a demo account</button><button className="btn2 !px-6 !py-3" onClick={()=>go('/register')}>Register as a student</button></div>
 <div className="mt-14 flex flex-wrap justify-center gap-2 text-sm font-semibold text-indigo-800">{['Idea','Guidance','Team','Planning','Collaboration','Development','Completion','Showcase'].map((x,i)=><span key={x} className="rounded-full bg-white px-4 py-1.5 shadow-sm ring-1 ring-indigo-100">{i+1}. {x}</span>)}</div>
 <p className="mt-10 text-xs text-slate-400">Front-end prototype: data stays in your browser. Verification, AI suggestions and calls are simulations.</p></main></div>}

const RL={student:'Student',college:'College Authority',admin:'Platform Admin',mentor:'Mentor'};
const ROLES=[['mentor','Mentor','Guide student teams as faculty, alumni or industry.','🧭'],['student','Student','Share ideas, find teammates and mentors, run projects.','🎓'],['college','College Authority','Discover student projects and highlight innovation.','🏛️'],['admin','Platform Admin','Verify users, moderate content, view analytics.','🛡️']];
function Roles(){const A=useA();const enter=u=>{const r=A.login(u.email,u.password);if(r){A.say('Signed in as '+r.name);go('/app/dashboard')}};
 return <div className="mx-auto max-w-5xl p-4 sm:p-8"><button className="text-sm font-semibold text-indigo-700" onClick={()=>go('/')}>← Back</button><h1 className="mt-3 text-3xl font-extrabold">Choose an account type</h1><p className="mb-6 text-slate-500">Demo accounts come with sample data. Password for all: <code className="rounded bg-slate-100 px-1">demo123</code></p>
 <div className="grid gap-4 md:grid-cols-2 lg:grid-cols-4">{ROLES.map(([r,n,d,e])=><div key={r} className="card"><div className="text-3xl">{e}</div><h2 className="mt-2 text-lg font-bold">{n}</h2><p className="mb-3 text-sm text-slate-500">{d}</p>
 <div className="space-y-2">{A.s.users.filter(u=>u.role===r&&u.demo).map(u=><button key={u.id} onClick={()=>enter(u)} className="flex w-full items-center gap-3 rounded-xl p-2 text-left ring-1 ring-slate-100 transition hover:bg-indigo-50"><Av n={u.name} size="h-9 w-9"/><span className="min-w-0"><span className="block truncate text-sm font-semibold">{u.name}</span><span className="block truncate text-xs text-slate-400">{u.dept}{u.inst?' · '+A.inst(u.inst).split(' ')[0]:''}</span></span></button>)}</div></div>)}</div></div>}

function Login(){const A=useA();const [e,setE]=useState('');const [p,setP]=useState('');const [err,setErr]=useState('');
 const sub=ev=>{ev.preventDefault();const u=A.login(e,p);if(u){A.say('Welcome back, '+u.name.split(' ')[0]);go('/app/dashboard')}else setErr('Email or password is incorrect. Demo accounts use password demo123.')};
 return <div className="flex min-h-screen items-center justify-center bg-indigo-50 p-4"><form onSubmit={sub} className="card w-full max-w-sm space-y-4"><h1 className="text-2xl font-extrabold">Log in</h1>
 <F l="Email"><input className="inp" type="email" value={e} onChange={x=>setE(x.target.value)} required autoFocus/></F><F l="Password"><input className="inp" type="password" value={p} onChange={x=>setP(x.target.value)} required/></F>
 {err&&<p role="alert" className="text-sm text-rose-600">{err}</p>}<button className="btn w-full">Log in</button>
 <p className="text-center text-sm text-slate-500">New here? <a className="font-semibold text-indigo-700" href="#/register">Create an account</a> or <a className="font-semibold text-indigo-700" href="#/roles">use a demo account</a></p><p className="text-center"><Sim t="Prototype login: not real authentication"/></p></form></div>}

function Register(){const A=useA();const [st,setSt]=useState(0);const [code,setCode]=useState('');const [err,setErr]=useState('');
 const [d,setD]=useState({name:'',email:'',password:'',inst:'',dept:'',year:'',domains:[],skills:[],interests:[],prev:'',github:'',collab:[],avail:'Flexible'});const set=p=>setD(x=>({...x,...p}));
 const steps=['Account','Academic','Skills & interests','Preferences & verify'];
 const check=()=>{if(st===0){if(!d.name.trim())return'Enter your full name.';if(!/^\S+@\S+\.\S+$/.test(d.email))return'Enter a valid email address.';if(d.password.length<6)return'Password needs at least 6 characters.';if(A.s.users.some(u=>u.email.toLowerCase()===d.email.trim().toLowerCase()))return'That email is already registered. Try logging in.'}
  if(st===1&&(!d.inst||!d.dept.trim()||!d.year))return'Choose your college, department and year.';
  if(st===2&&(!d.domains.length||!d.skills.length))return'Pick at least one domain and one skill.';
  if(st===3&&code!=='482913')return'Enter the demo code 482913 to complete the simulated verification.';return''};
 const next=()=>{const m=check();setErr(m);if(m)return;if(st<3)setSt(st+1);else{const u=A.register(d);if(u){A.say('Account created. Welcome, '+u.name.split(' ')[0]+'!');go('/app/dashboard')}else setErr('Could not create the account.')}};
 return <div className="mx-auto max-w-2xl p-4 sm:p-8"><button className="text-sm font-semibold text-indigo-700" onClick={()=>go('/')}>← Back</button><h1 className="mt-3 text-3xl font-extrabold">Create your student account</h1>
 <div className="my-5 flex gap-2">{steps.map((s,i)=><div key={s} className="flex-1"><div className={'h-1.5 rounded-full '+(i<=st?'bg-indigo-600':'bg-slate-200')}/><div className={'mt-1 hidden text-xs sm:block '+(i===st?'font-bold text-indigo-700':'text-slate-400')}>{s}</div></div>)}</div>
 <div className="card space-y-4"><h2 className="font-bold sm:hidden">{steps[st]}</h2>
 {st===0&&<div className="space-y-3"><F l="Full name"><input className="inp" value={d.name} onChange={e=>set({name:e.target.value})}/></F><F l="College email"><input className="inp" type="email" value={d.email} onChange={e=>set({email:e.target.value})}/></F><F l="Password" hint="Stored only in this browser (prototype)."><input className="inp" type="password" value={d.password} onChange={e=>set({password:e.target.value})}/></F></div>}
 {st===1&&<Academic d={d} set={set}/>}{st===2&&<SkillF d={d} set={set}/>}
 {st===3&&<div className="space-y-4"><PrefF d={d} set={set}/><div className="rounded-xl bg-amber-50 p-4 ring-1 ring-amber-200"><Sim t="Simulated college verification"/><p className="mt-2 text-sm text-slate-700">No email or OTP is actually sent. For this demo, enter code <b>482913</b>.</p><input className="inp mt-2 max-w-[10rem]" inputMode="numeric" maxLength="6" value={code} onChange={e=>setCode(e.target.value)} placeholder="6-digit code"/></div></div>}
 {err&&<p role="alert" className="text-sm text-rose-600">{err}</p>}
 <div className="flex justify-between">{st>0?<button className="btn2" onClick={()=>{setErr('');setSt(st-1)}}>Back</button>:<span/>}<button className="btn" onClick={next}>{st<3?'Continue':'Create account'}</button></div></div></div>}

/* ===== PHASE 2: shared post/project record (feed, discover and dashboard all read A.s.posts) ===== */
const TYPES=[['idea','Idea'],['mini','Mini project'],['ongoing','Ongoing project'],['completed','Completed project'],['research','Research'],['collab','Collaboration request'],['question','Question']];
const tName=t=>(TYPES.find(x=>x[0]===t)||[])[1]||t;
const uOf=(A,id)=>A.s.users.find(u=>u.id===id);
const ago=d=>{const m=Math.round((Date.now()-new Date(d))/6e4);return m<60?Math.max(m,1)+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'};
const isProj=p=>p.type!=='question';
const isOpen=p=>p.type!=='completed'&&p.type!=='question'&&p.roles.length>0;
const visible=(A,p)=>{const a=uOf(A,p.authorId);const me=A.user;if(p.hidden&&me.role!=='admin'&&p.authorId!==me.id)return false;return !a||a.id===me.id||me.role==='admin'||a.privacy.projects==='public'||(a.privacy.projects==='college'&&a.inst===me.inst)};

function PostForm({init,onSave,onClose}){const [d,setD]=useState(init||{type:'idea',title:'',domain:DOMAINS[0],desc:'',skills:[],links:''});const [roles,setR]=useState(init?init.roles.join(', '):'');const [err,setErr]=useState('');const set=p=>setD(x=>({...x,...p}));
 const submit=()=>{if(d.title.trim().length<5)return setErr('Give your post a title of at least 5 characters.');if(d.desc.trim().length<15)return setErr('Describe it in at least 15 characters so others can understand it.');onSave({...d,title:d.title.trim(),desc:d.desc.trim(),roles:roles.split(',').map(x=>x.trim()).filter(Boolean)})};
 return <Modal title={init?'Edit post':'Share with the community'} onClose={onClose}><div className="space-y-3">
 <div className="grid gap-3 sm:grid-cols-2"><F l="Type"><select className="inp" value={d.type} onChange={e=>set({type:e.target.value})}>{TYPES.map(([v,n])=><option key={v} value={v}>{n}</option>)}</select></F><F l="Domain"><select className="inp" value={d.domain} onChange={e=>set({domain:e.target.value})}>{DOMAINS.map(x=><option key={x}>{x}</option>)}</select></F></div>
 <F l="Title"><input className="inp" value={d.title} onChange={e=>set({title:e.target.value})}/></F><F l="Description"><textarea className="inp" rows="4" value={d.desc} onChange={e=>set({desc:e.target.value})}/></F>
 <F l="Skills needed"><Chips opts={SKILLS} val={d.skills} on={v=>set({skills:v})} custom/></F>
 <F l="Open roles" hint="Separate with commas, e.g. UI designer, Data analyst"><input className="inp" value={roles} onChange={e=>setR(e.target.value)}/></F>
 <F l="Project link (optional)"><input className="inp" value={d.links} onChange={e=>set({links:e.target.value})} placeholder="github.com/… or a document link"/></F>
 {err&&<p role="alert" className="text-sm text-rose-600">{err}</p>}<div className="flex justify-end gap-2"><button className="btn2" onClick={onClose}>Cancel</button><button className="btn" onClick={submit}>{init?'Save changes':'Publish'}</button></div></div></Modal>}
function JoinModal({p,onClose}){const A=useA();const [m,setM]=useState('');return <Modal title={'Request to join: '+p.title} onClose={onClose}><F l="Why you, and what can you contribute?"><textarea className="inp" rows="4" value={m} onChange={e=>setM(e.target.value)}/></F><div className="mt-3 flex justify-end gap-2"><button className="btn2" onClick={onClose}>Cancel</button><button className="btn" onClick={()=>{if(m.trim().length<10){A.say('Add a short message (10+ characters).','err');return}A.join(p.id,m.trim());A.say('Request sent to the project owner');onClose()}}>Send request</button></div></Modal>}

function PostCard({p,onProfile,onEdit,onDelete,onJoin}){const A=useA();const me=A.user;const a=uOf(A,p.authorId)||{name:'Deleted user'};const mine=p.authorId===me.id;const [cm,setCm]=useState(false);const [t,setT]=useState('');const [rp,setRp]=useState(false);
 const sub=()=>{if(!t.trim())return;A.comment(p.id,t.trim());setT('')};
 const share=async()=>{const url=location.href.split('#')[0]+'#/app/feed';try{await navigator.clipboard.writeText(url);A.say('Link copied')}catch(e){A.say('Copy this link: '+url)}};
 const req=p.joins.find(j=>j.userId===me.id);
 return <article className="card space-y-3">{rp&&<ReportModal type="post" id={p.id} onClose={()=>setRp(false)}/>}<div className="flex items-start gap-3"><button onClick={()=>onProfile(a)} aria-label="View profile"><Av n={a.name}/></button><div className="min-w-0 flex-1"><button className="text-sm font-bold hover:underline" onClick={()=>onProfile(a)}>{a.name}</button><div className="text-xs text-slate-400">{A.inst(a.inst)} · {a.dept} · {ago(p.at)}</div></div><span className="chip on">{tName(p.type)}</span>{!mine&&<button className="text-xs text-slate-400 hover:text-rose-600" onClick={()=>setRp(true)}>⚑ Report</button>}</div>
 <h3 className="text-lg font-bold">{p.title}</h3><p className="text-sm text-slate-600">{p.desc}</p>
 <div className="flex flex-wrap gap-1.5"><span className="chip">{p.domain}</span>{p.skills.map(s=><span key={s} className="chip">{s}</span>)}</div>
 {p.links&&<p className="text-xs text-indigo-700">🔗 {p.links}</p>}{isOpen(p)&&<p className="text-xs text-slate-500">Open roles: {p.roles.join(', ')}</p>}
 <div className="flex flex-wrap items-center gap-2 border-t border-slate-50 pt-3"><button className={'chip '+(p.likes.includes(me.id)?'on':'')} onClick={()=>A.toggle(p.id,'likes','liked')}>♥ {p.likes.length}</button><button className="chip" onClick={()=>setCm(!cm)}>💬 {p.comments.length}</button><button className="chip" onClick={share}>↗ Share</button>
 <button className={'chip '+(p.saves.includes(me.id)?'on':'')} onClick={()=>{A.say(p.saves.includes(me.id)?'Removed from saved':'Saved');A.toggle(p.id,'saves')}}>🔖 Save</button>
 {!mine&&(p.type==='idea'||p.type==='collab')&&<button className={'chip '+(p.interested.includes(me.id)?'on':'')} onClick={()=>A.toggle(p.id,'interested','is interested in')}>★ Interested ({p.interested.length})</button>}
 {!mine&&isOpen(p)&&(req?<span className="chip">Request {req.status}</span>:<button className="btn !px-3 !py-1 text-xs" onClick={()=>onJoin(p)}>Request to join</button>)}
 {mine&&<span className="ml-auto flex gap-2"><button className="chip" onClick={()=>onEdit(p)}>Edit</button><button className="chip !text-rose-600" onClick={()=>onDelete(p)}>Delete</button></span>}</div>
 {mine&&p.joins.length>0&&<p className="text-xs text-violet-700">{p.joins.length} join request(s) received. <button className="font-semibold underline" onClick={()=>go('/app/teams')}>Review in My Teams</button></p>}
 {cm&&<div className="space-y-2 rounded-xl bg-slate-50 p-3">{p.comments.map(c=><p key={c.id} className="text-sm"><b>{(uOf(A,c.userId)||{name:'User'}).name}</b> {c.text}</p>)}<div className="flex gap-2"><input className="inp" placeholder="Write a comment" value={t} onChange={e=>setT(e.target.value)} onKeyDown={e=>e.key==='Enter'&&sub()}/><button className="btn" onClick={sub}>Post</button></div></div>}</article>}

function Feed(){const A=useA();const [f,setF]=useState('all');const [q,setQ]=useState('');const [dm,setDm]=useState('');const [form,setForm]=useState(null);const [del,setDel]=useState(null);const [pv,setPv]=useState(null);const [jn,setJn]=useState(null);
 const list=A.s.posts.filter(p=>visible(A,p)&&(f==='all'||p.type===f)&&(!dm||p.domain===dm)&&(p.title+p.desc+p.skills.join()).toLowerCase().includes(q.trim().toLowerCase())).sort((a,b)=>b.at.localeCompare(a.at));
 return <div className="mx-auto max-w-3xl space-y-4"><div className="flex items-center justify-between"><h1 className="text-2xl font-extrabold">Project Feed</h1><button className="btn" onClick={()=>setForm({})}>+ Share</button></div>
 <SpotBanner/><div className="flex flex-wrap gap-2">{[['all','All'],...TYPES].map(([v,n])=><button key={v} className={'chip '+(f===v?'on':'')} onClick={()=>setF(v)}>{n}</button>)}</div>
 <div className="grid gap-2 sm:grid-cols-2"><input className="inp" placeholder="Search posts, skills" value={q} onChange={e=>setQ(e.target.value)}/><select className="inp" value={dm} onChange={e=>setDm(e.target.value)}><option value="">All domains</option>{DOMAINS.map(x=><option key={x}>{x}</option>)}</select></div>
 {list.length?list.map(p=><PostCard key={p.id} p={p} onProfile={setPv} onEdit={x=>setForm(x)} onDelete={setDel} onJoin={setJn}/>):<div className="card text-center text-sm text-slate-500">No posts match these filters. Clear a filter or share your own idea.</div>}
 {form&&<PostForm init={form.id?form:null} onClose={()=>setForm(null)} onSave={d=>{if(form.id){A.editPost(form.id,d);A.say('Post updated')}else{A.addPost(d);A.say('Published to the feed')}setForm(null)}}/>}
 {del&&<Confirm title="Delete this post?" text={'“'+del.title+'” will be removed for everyone, including Discover Projects.'} onNo={()=>setDel(null)} onYes={()=>{A.delPost(del.id);setDel(null);A.say('Post deleted')}}/>}
 {jn&&<JoinModal p={jn} onClose={()=>setJn(null)}/>}{pv&&<PublicProfile u={pv} onClose={()=>setPv(null)}/>}</div>}

function Projects(){const A=useA();const me=A.user;const [q,setQ]=useState('');const [dm,setDm]=useState('');const [sk,setSk]=useState('');const [col,setCol]=useState('');const [st,setSt]=useState('');const [det,setDet]=useState(null);const [jn,setJn]=useState(null);
 const all=A.s.posts.filter(p=>isProj(p)&&visible(A,p));const skills=[...new Set(all.flatMap(p=>p.skills))].sort();
 const list=all.filter(p=>(!dm||p.domain===dm)&&(!sk||p.skills.includes(sk))&&(!col||(uOf(A,p.authorId)||{}).inst===col)&&(!st||p.type===st)&&(p.title+p.desc).toLowerCase().includes(q.trim().toLowerCase()));
 const d=det&&A.s.posts.find(x=>x.id===det);
 const Apply=({p})=>{const r=p.joins.find(j=>j.userId===me.id);return p.authorId===me.id?<span className="chip">Your project</span>:!isOpen(p)?<span className="chip">Not recruiting</span>:r?<span className="chip">Request {r.status}</span>:<button className="btn !px-3 !py-1.5 text-xs" onClick={()=>setJn(p)}>Apply to join</button>};
 return <div className="space-y-4"><h1 className="text-2xl font-extrabold">Discover Projects</h1>
 <div className="grid gap-2 sm:grid-cols-2 lg:grid-cols-5"><input className="inp lg:col-span-1" placeholder="Search projects" value={q} onChange={e=>setQ(e.target.value)}/>
 <select className="inp" value={dm} onChange={e=>setDm(e.target.value)}><option value="">All domains</option>{DOMAINS.map(x=><option key={x}>{x}</option>)}</select><select className="inp" value={sk} onChange={e=>setSk(e.target.value)}><option value="">Any skill</option>{skills.map(x=><option key={x}>{x}</option>)}</select>
 <select className="inp" value={col} onChange={e=>setCol(e.target.value)}><option value="">All colleges</option>{A.s.institutions.map(i=><option key={i.id} value={i.id}>{i.name}</option>)}</select><select className="inp" value={st} onChange={e=>setSt(e.target.value)}><option value="">Any stage</option>{TYPES.filter(t=>t[0]!=='question').map(([v,n])=><option key={v} value={v}>{n}</option>)}</select></div>
 {list.length?<div className="grid gap-4 md:grid-cols-2">{list.map(p=>{const o=uOf(A,p.authorId)||{name:'Deleted user'};return <div key={p.id} className="card flex flex-col space-y-2"><div className="flex items-start justify-between gap-2"><h3 className="font-bold">{p.title}</h3><span className={'chip shrink-0 '+(isOpen(p)?'on':'')}>{isOpen(p)?'Open':'Closed'}</span></div>
 <p className="line-clamp-2 text-sm text-slate-600">{p.desc}</p><div className="text-xs text-slate-400">{o.name} · {A.inst(o.inst)}</div><div className="flex flex-wrap gap-1.5"><span className="chip">{tName(p.type)}</span><span className="chip">{p.domain}</span>{p.skills.slice(0,4).map(s=><span key={s} className="chip">{s}</span>)}</div>
 <div className="flex items-center gap-1">{p.team.map(id=><Av key={id} n={(uOf(A,id)||{name:'?'}).name} size="h-7 w-7"/>)}<span className="ml-1 text-xs text-slate-500">{isOpen(p)?p.roles.length+' open: '+p.roles.join(', '):'No open positions'}</span></div>
 <div className="mt-auto flex flex-wrap items-center gap-2 pt-2"><button className="btn2 !px-3 !py-1.5 text-xs" onClick={()=>setDet(p.id)}>View details</button><button className={'chip '+(p.saves.includes(me.id)?'on':'')} onClick={()=>{A.say(p.saves.includes(me.id)?'Removed from saved':'Project saved');A.toggle(p.id,'saves')}}>🔖 Save</button><Apply p={p}/></div></div>})}</div>:<div className="card text-center text-sm text-slate-500">No projects match. Loosen a filter, or share your own idea in the Project Feed.</div>}
 {d&&<Modal title={d.title} onClose={()=>setDet(null)}><div className="space-y-3 text-sm"><p>{d.desc}</p><div><b>Stage:</b> {tName(d.type)} · <b>Domain:</b> {d.domain} · <b>Progress:</b> {d.progress}%</div><Bar v={d.progress}/><div><b>Required skills:</b> {d.skills.join(', ')||'—'}</div><div><b>Open positions:</b> {d.roles.length&&isOpen(d)?d.roles.join(', '):'None right now'}</div><div><b>Team:</b> {d.team.map(id=>(uOf(A,id)||{name:'?'}).name).join(', ')}</div>{d.links&&<div className="text-indigo-700">🔗 {d.links}</div>}<div className="flex justify-end"><Apply p={d}/></div></div></Modal>}
 {jn&&<JoinModal p={jn} onClose={()=>setJn(null)}/>}</div>}

function DashExtra(){const A=useA();const me=A.user;const ps=A.s.posts;const [pv,setPv]=useState(null);
 const rec=ps.filter(p=>isProj(p)&&p.authorId!==me.id&&isOpen(p)&&visible(A,p)).map(p=>({p,m:p.skills.filter(s=>me.skills.includes(s)),d:me.domains.includes(p.domain)})).filter(x=>x.m.length||x.d).slice(0,3);
 const mates=A.s.users.filter(u=>u.role==='student'&&u.id!==me.id&&u.privacy.open&&canSee(me,u)).map(u=>({u,same:u.inst===me.inst,sh:[...u.domains.filter(x=>me.domains.includes(x)),...u.interests.filter(x=>me.interests.includes(x))],add:u.skills.filter(x=>!me.skills.includes(x))})).filter(x=>x.sh.length||x.add.length).sort((a,b)=>(b.same-a.same)||(b.sh.length-a.sh.length)||(b.add.length-a.add.length)).slice(0,3);
 const mine=ps.filter(p=>isProj(p)&&p.team.includes(me.id));
 const inc=ps.filter(p=>p.authorId===me.id).flatMap(p=>p.joins.filter(j=>j.status==='pending').map(j=>({p,j})));const out=ps.filter(p=>p.joins.some(j=>j.userId===me.id));
 const Row=({children,on})=><button onClick={on} className="block w-full border-b border-slate-50 py-2 text-left text-sm last:border-0">{children}</button>;
 return <div className="grid gap-4 md:grid-cols-2">

function compat(A,t,post){const us=t.members.map(m=>uOf(A,m.userId)).filter(Boolean);const n=us.length;const req=post?post.skills:[];const have=teamSkills(A,t);const miss=req.filter(x=>!have.includes(x));
 const uniq=us.filter(u=>u.skills.some(x=>us.every(o=>o===u||!o.skills.includes(x)))).length;const ints=[...new Set(us.flatMap(u=>u.interests))].filter(i=>us.filter(u=>u.interests.includes(i)).length>1);
 const av=us.filter(u=>u.avail==='Flexible'||us.filter(o=>o.avail===u.avail).length>=Math.ceil(n/2)).length;const unset=t.members.filter(m=>m.role==='Member').length;
 return [{l:'Skill coverage',ok:!miss.length,t:req.length?(req.length-miss.length)+' of '+req.length+' required skills are covered'+(miss.length?'. Missing: '+miss.join(', ')+'.':'.'):'No required skills were listed for this project.'},
 {l:'Complementary skills',ok:n>1&&uniq>=Math.ceil(n/2),t:n>1?uniq+' of '+n+' members bring skills no one else on the team has.':'Add members to see how skills complement each other.'},

 {l:'Availability',ok:n<2||av>=Math.ceil(n/2)+ (n>2?0:0)&&av===n,t:n<2?'Add members to compare availability.':av===n?'Everyone’s availability overlaps (Flexible matches any slot).':(n-av)+' member(s) have availability that rarely overlaps with the others: '+us.map(u=>u.name.split(' ')[0]+' ('+u.avail+')').join(', ')+'.'},
 {l:'Role distribution',ok:unset===0,t:unset?unset+' member(s) still have the generic “Member” role. Assign clear responsibilities.':'Every member has a defined role.'},

 <div className="grid gap-2 sm:grid-cols-3 lg:grid-cols-6"><input className="inp" placeholder="Search" value={q} onChange={e=>setQ(e.target.value)}/><select className="inp" value={dm} onChange={e=>setDm(e.target.value)}><option value="">Domain</option>{DOMAINS.map(x=><option key={x}>{x}</option>)}</select><select className="inp" value={sk} onChange={e=>setSk(e.target.value)}><option value="">Skill</option>{[...new Set([...SKILLS,...A.s.users.flatMap(u=>u.skills)])].sort().map(x=><option key={x}>{x}</option>)}</select><select className="inp" value={it} onChange={e=>setIt(e.target.value)}><option value="">Interest</option>{INTERESTS.map(x=><option key={x}>{x}</option>)}</select><select className="inp" value={col} onChange={e=>setCol(e.target.value)}><option value="">College</option>{A.s.institutions.map(i=><option key={i.id} value={i.id}>{i.name}</option>)}</select><select className="inp" value={av} onChange={e=>setAv(e.target.value)}><option value="">Availability</option>{AVAIL.map(x=><option key={x}>{x}</option>)}</select></div>

 {!u.privacy.open?<span className="chip">Not taking requests</span>:sc?<span className="chip">Request sent</span>:<button className="btn !px-3 !py-1.5 text-xs" onClick={()=>setCm(u)}>Send request</button>}</div></div>})}</div>:<div className="card text-center text-sm text-slate-500">No one matches these filters. Clear a filter or switch the match type.</div>}

function Teams(){const A=useA();const me=A.user;const {teams,posts}=A.s;const collabs=A.s.collabs||[];const mine=teams.filter(t=>t.members.some(m=>m.userId===me.id));const [sel,setSel]=useState(null);const [cr,setCr]=useState(false);const [pv,setPv]=useState(null);
 const inc=collabs.filter(c=>c.toId===me.id&&c.status==='pending');const jr=posts.filter(p=>p.authorId===me.id).flatMap(p=>p.joins.filter(j=>j.status==='pending').map(j=>({p,j})));const out=collabs.filter(c=>c.fromId===me.id);
 const t=mine.find(x=>x.id===sel)||mine[0];const post=t&&posts.find(p=>p.id===t.postId);const lead=t&&t.leaderId===me.id;
 const nm=id=>(uOf(A,id)||{name:'Someone'}).name;const Btns=({y,n})=><span className="flex gap-2"><button className="btn !px-3 !py-1 text-xs" onClick={y}>Accept</button><button className="btn2 !px-3 !py-1 text-xs" onClick={n}>Reject</button></span>;

 {inc.map(c=><div key={c.id} className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-50 py-2 text-sm last:border-0"><span><b>{nm(c.fromId)}</b> {c.postId?'invited you to join “'+((posts.find(p=>p.id===c.postId)||{}).title||'a project')+'”':'wants to collaborate'}<span className="block text-xs text-slate-500">“{c.msg}”</span></span><Btns y={()=>{A.respondCollab(c.id,true);A.say(c.postId?'You joined the team':'Request accepted')}} n={()=>{A.respondCollab(c.id,false);A.say('Request declined')}}/></div>)}</>:<p className="text-sm text-slate-400">No pending requests.</p>}
 {out.length>0&&<p className="mt-2 text-xs text-slate-500">Sent by you: {out.map(c=>nm(c.toId)+' ('+c.status+')').join(', ')}</p>}</div>
 {mine.length?<><div className="flex flex-wrap gap-2">{mine.map(x=><button key={x.id} className={'chip '+(t.id===x.id?'on':'')} onClick={()=>setSel(x.id)}>{x.name}</button>)}</div>
 {t&&post&&(()=>{const have=teamSkills(A,t);const miss=post.skills.filter(x=>!have.includes(x));const cov=post.skills.length?Math.round((post.skills.length-miss.length)/post.skills.length*100):100;return <div className="grid gap-4 lg:grid-cols-3"><div className="space-y-4 lg:col-span-2"><div className="card"><div className="flex items-start justify-between gap-2"><div><h2 className="text-lg font-bold">{t.name}</h2><p className="text-sm text-slate-500">Project: {post.title} · {post.domain} · {tName(post.type)}</p></div><span className="flex flex-wrap gap-2"><span className="chip on">Leader: {nm(t.leaderId)}</span><button className="btn2 !px-3 !py-1 text-xs" onClick={()=>go('/app/workspace/'+post.id)}>Open workspace</button></span></div><p className="mt-2 text-sm text-slate-600">{post.desc}</p><div className="mt-3"><div className="mb-1 flex justify-between text-xs font-semibold"><span>Project progress</span><span>{post.progress}%</span></div><Bar v={post.progress}/></div></div>
 <div className="card"><div className="mb-2 flex items-center justify-between"><h2 className="font-bold">Members ({t.members.length})</h2>{lead&&<button className="btn2 !px-3 !py-1 text-xs" onClick={()=>{PCTX={postId:post.id};go('/app/people')}}>Invite members</button>}</div>

 {lead&&m.userId!==t.leaderId?<select aria-label="Role" className="inp !w-auto" value={m.role} onChange={e=>{A.setRole(t.id,m.userId,e.target.value);A.say('Role updated')}}>{ROLES_LIST.filter(r=>r!=='Leader').map(r=><option key={r}>{r}</option>)}</select>:<span className="chip">{m.role}</span>}</div>})}</div></div>
 <div className="space-y-4"><div className="card"><h2 className="font-bold">Skill coverage</h2><div className="my-2 flex items-center gap-2"><div className="flex-1"><Bar v={cov}/></div><b className="text-sm">{cov}%</b></div><div className="flex flex-wrap gap-1.5">{post.skills.map(x=><span key={x} className={'chip '+(have.includes(x)?'on':'!text-rose-600')}>{have.includes(x)?'✓ ':'✗ '}{x}</span>)}</div>

 :<div className="card text-center text-sm text-slate-500">You are not in a team yet. Create one from a project you shared, accept an invitation above, or request to join a project in Discover Projects.</div>}

function Roadmap({post}){const A=useA();const me=A.user;const [o,setO]=useState(-1);const [k,setK]=useState(tplFor(post.domain));const [nt,setNt]=useState('');

 const set=(i,p)=>A.setStage(post.id,i,p);const mn=mids.concat(post.mentors||[]).filter((x,i,a)=>a.indexOf(x)===i).map(id=>(uOf(A,id)||{name:''}).name).filter(Boolean);

 return {rows,miss,cands,mentors}}

   <div className="mt-1 flex flex-wrap gap-1">{u.skills.map(x=><span key={x} className={'chip !py-0 '+(post.skills.includes(x)?'on':'')}>{x}</span>)}</div><Resp post={post} id={u.id} canEdit={lead||u.id===me.id}/></div>})}

  <div className="card space-y-3"><div className="flex flex-wrap items-center justify-between gap-2"><h2 className="font-bold">Skill gap analysis</h2><Sim t="Rule-based, not AI"/></div>

    <div className="mt-2 flex flex-wrap gap-2"><button className="btn2 !px-3 !py-1 text-xs" onClick={()=>setPv(u)}>View profile</button>{lead?(!u.privacy.open?<span className="chip">Not taking requests</span>:sent?<span className="chip">Invitation sent</span>:<button className="btn !px-3 !py-1 text-xs" onClick={()=>setCm(u)}>Invite to project</button>):<span className="text-xs text-slate-400">Ask the project leader to invite</span>}</div></div>})}</div>:<p className="text-sm text-slate-500">No one visible on SkillSync has these skills yet. Try a mentor, or study them yourselves (below).</p>}

function TaskForm({post,init,onSave,onClose}){const A=useA();const [d,setD]=useState(init||{title:'',desc:'',assignee:'',deadline:'',priority:'med',status:'todo',stageId:''});const [err,setErr]=useState('');const set=p=>setD(x=>({...x,...p}));
 const submit=()=>{if(d.title.trim().length<3)return setErr('Give the task a title of at least 3 characters.');if(!init&&d.deadline&&d.deadline<todayS())return setErr('The deadline is in the past. Pick today or a later date.');onSave({...d,title:d.title.trim(),desc:d.desc.trim()})};
 return <Modal title={init?'Edit task':'New task'} onClose={onClose}><div className="space-y-3"><F l="Task title"><input className="inp" value={d.title} onChange={e=>set({title:e.target.value})} autoFocus/></F><F l="Description (optional)"><textarea className="inp" rows="2" value={d.desc} onChange={e=>set({desc:e.target.value})}/></F>
  <div className="grid gap-3 sm:grid-cols-2"><F l="Assign to"><select className="inp" value={d.assignee} onChange={e=>set({assignee:e.target.value})}><option value="">Unassigned</option>{post.team.map(id=><option key={id} value={id}>{nmOf(A,id)}</option>)}</select></F><F l="Deadline"><input type="date" className="inp" value={d.deadline} onChange={e=>set({deadline:e.target.value})}/></F>
  <F l="Priority"><select className="inp" value={d.priority} onChange={e=>set({priority:e.target.value})}>{Object.entries(PRIO).map(([v,x])=><option key={v} value={v}>{x[0]}</option>)}</select></F><F l="Status"><select className="inp" value={d.status} onChange={e=>set({status:e.target.value})}>{TSTAT.map(([v,n])=><option key={v} value={v}>{n}</option>)}</select></F></div>
  {post.roadmap&&<F l="Roadmap stage (optional)"><select className="inp" value={d.stageId} onChange={e=>set({stageId:e.target.value})}><option value="">Not linked</option>{post.roadmap.map((s,i)=><option key={s.id} value={s.id}>{i+1}. {s.title}</option>)}</select></F>}
  {err&&<p role="alert" className="text-sm text-rose-600">{err}</p>}<div className="flex justify-end gap-2"><button className="btn2" onClick={onClose}>Cancel</button><button className="btn" onClick={submit}>{init?'Save task':'Create task'}</button></div></div></Modal>}

function WTasks({post}){const A=useA();const me=A.user;const lead=post.authorId===me.id;const [f,setF]=useState('all');const [form,setForm]=useState(null);const [del,setDel]=useState(null);const all=post.tasks||[];
 const list=all.filter(t=>f==='all'||(f==='mine'?t.assignee===me.id:f==='late'?isLate(t):!t.assignee)).sort((a,b)=>(a.deadline||'9').localeCompare(b.deadline||'9'));
 return <div className="space-y-4"><div className="flex flex-wrap items-center justify-between gap-2"><div className="flex flex-wrap gap-2">{[['all','All ('+all.length+')'],['mine','Assigned to me'],['late','Overdue'],['none','Unassigned']].map(([v,n])=><button key={v} className={'chip '+(f===v?'on':'')} onClick={()=>setF(v)}>{n}</button>)}</div><button className="btn" onClick={()=>setForm({})}>+ New task</button></div>
  {all.length===0?<div className="card text-center text-sm text-slate-500">No tasks yet. Break the project into small tasks, assign owners and set deadlines.<div className="mt-3"><button className="btn" onClick={()=>setForm({})}>Create the first task</button></div></div>:
  <div className="grid gap-3 md:grid-cols-2 xl:grid-cols-4">{TSTAT.map(([v,n])=>{const col=list.filter(t=>t.status===v);return <div key={v} className="rounded-2xl bg-slate-100/70 p-3"><div className="mb-2 flex items-center justify-between text-sm font-bold"><span>{n}</span><span className="chip !py-0">{col.length}</span></div><div className="space-y-2">{col.map(t=><div key={t.id} className="space-y-2 rounded-xl bg-white p-3 text-sm shadow-sm ring-1 ring-slate-100"><div className="flex items-start justify-between gap-2"><b className={t.status==='done'?'text-slate-400 line-through':''}>{t.title}</b><span className={'inline-flex shrink-0 rounded-full px-2 py-0.5 text-[11px] font-semibold ring-1 '+PRIO[t.priority||'med'][1]}>{PRIO[t.priority||'med'][0]}</span></div>
   {t.desc&&<p className="text-xs text-slate-500">{t.desc}</p>}<div className="flex flex-wrap items-center gap-2 text-xs text-slate-500">{t.assignee?<span className="flex items-center gap-1"><Av n={nmOf(A,t.assignee)} size="h-5 w-5"/>{nmOf(A,t.assignee).split(' ')[0]}</span>:<span>Unassigned</span>}{t.deadline&&<span className={isLate(t)?'font-bold text-rose-600':''}>{isLate(t)?'Overdue · ':'Due '}{t.deadline}</span>}</div>
   {t.stageId&&post.roadmap&&<p className="text-[11px] text-indigo-700">Stage: {(post.roadmap.find(s=>s.id===t.stageId)||{title:'—'}).title}</p>}
   <div className="flex items-center gap-1"><select aria-label="Task status" className="inp !py-1 text-xs" value={t.status} onChange={e=>{A.editTask(post.id,t.id,{status:e.target.value});A.say('Task moved to '+TSTAT.find(x=>x[0]===e.target.value)[1])}}>{TSTAT.map(([s,l])=><option key={s} value={s}>{l}</option>)}</select><button className="chip" onClick={()=>setForm(t)}>Edit</button>{(lead||t.by===me.id)&&<button className="chip !text-rose-600" onClick={()=>setDel(t)}>Delete</button>}</div></div>)}{col.length===0&&<p className="py-2 text-center text-xs text-slate-400">Nothing here</p>}</div></div>})}</div>}
  {form&&<TaskForm post={post} init={form.id?form:null} onClose={()=>setForm(null)} onSave={d=>{if(form.id){A.editTask(post.id,form.id,d);A.say('Task updated')}else{A.addTask(post.id,d);A.say('Task created')}setForm(null)}}/>}
  {del&&<Confirm title="Delete this task?" text={'“'+del.title+'” will be removed for everyone on the team.'} onNo={()=>setDel(null)} onYes={()=>{A.delTask(post.id,del.id);setDel(null);A.say('Task deleted')}}/>}</div>}

function WDisc({post}){const A=useA();const me=A.user;const lead=post.authorId===me.id;const [t,setT]=useState('');const [del,setDel]=useState(null);const list=post.disc||[];
 const send=()=>{if(t.trim().length<2){A.say('Write a message first.','err');return}A.addDisc(post.id,t.trim());setT('')};

  {del&&<Confirm title="Delete this message?" text="It will be removed for everyone in this project." onNo={()=>setDel(null)} onYes={()=>{A.delDisc(post.id,del.id);setDel(null);A.say('Message deleted')}}/>}</div>}

function WRes({post}){const A=useA();const me=A.user;const lead=post.authorId===me.id;const [mode,setMode]=useState('link');const [ti,setTi]=useState('');const [url,setUrl]=useState('');const [file,setFile]=useState(null);const [del,setDel]=useState(null);const [fk,setFk]=useState(0);const list=post.res||[];
 const add=()=>{if(mode==='link'){if(ti.trim().length<2){A.say('Give the link a short title.','err');return}if(!/^(https?:\/\/)?[^\s/]+\.[^\s]{2,}$/i.test(url.trim())){A.say('Enter a valid link, e.g. docs.google.com/… or github.com/…','err');return}A.addRes(post.id,{kind:'link',title:ti.trim(),url:url.trim()})}

  {mode==='link'?<div className="grid gap-2 sm:grid-cols-2"><input className="inp" placeholder="Title, e.g. Dataset notes" value={ti} onChange={e=>setTi(e.target.value)}/><input className="inp" placeholder="Link, e.g. github.com/team/repo" value={url} onChange={e=>setUrl(e.target.value)}/></div>:<div className="space-y-1"><input key={fk} type="file" className="inp" onChange={e=>setFile(e.target.files[0]||null)}/><p className="text-xs text-amber-700">Simulated upload: this prototype saves only the file’s name and size, not its contents.</p></div>}

function WMentor({post}){const A=useA();const rs=(A.s.mreqs||[]).filter(m=>m.postId===post.id).sort((a,b)=>b.at.localeCompare(a.at));const stg=post.roadmap&&post.roadmap[10];const live=rs.some(m=>m.status==='pending'||m.status==='active');

function MeetForm({post,onClose}){const A=useA();const me=A.user;const mids=projMentors(A,post);const [d,setD]=useState({title:'',kind:'team',date:'',agenda:'',participants:post.team.slice()});const [err,setErr]=useState('');const set=p=>setD(x=>({...x,...p}));const people=[...new Set([...post.team,...mids])];

  {err&&<p role="alert" className="text-sm text-rose-600">{err}</p>}<div className="flex justify-end gap-2"><button className="btn2" onClick={onClose}>Cancel</button><button className="btn" onClick={submit}>Schedule</button></div></div></Modal>}

function WMeet({post}){const A=useA();const me=A.user;const lead=post.authorId===me.id;const [form,setForm]=useState(false);const [cx,setCx]=useState(null);const [fin,setFin]=useState(null);const [notes,setNotes]=useState('');
 const all=(A.s.meetings||[]).filter(m=>m.postId===post.id);const nowD=new Date();const up=all.filter(m=>m.status==='scheduled'&&new Date(m.date)>=nowD).sort((a,b)=>a.date.localeCompare(b.date));const past=all.filter(m=>m.status==='scheduled'&&new Date(m.date)<nowD);const hist=all.filter(m=>m.status!=='scheduled').sort((a,b)=>b.date.localeCompare(a.date));
 const Card=({m})=>{const can=lead||m.createdBy===me.id;return <div className="card space-y-1 text-sm"><div className="flex flex-wrap items-center justify-between gap-2"><b>{m.title}</b><span className="flex gap-2"><span className="chip">{m.kind==='mentor'?'Mentor meeting':'Team meeting'}</span><span className={'chip '+(m.status==='completed'?'on':'')}>{m.status[0].toUpperCase()+m.status.slice(1)}</span></span></div><div className="text-xs text-slate-500">{when(m.date)} · {m.participants.map(id=>nmOf(A,id).split(' ')[0]).join(', ')}</div>{m.agenda&&<p className="text-xs"><b>Agenda:</b> {m.agenda}</p>}{m.notes&&<p className="rounded-lg bg-indigo-50 p-2 text-xs"><b>Notes:</b> {m.notes}</p>}
  {m.status==='scheduled'&&can&&<div className="flex gap-2 pt-1"><button className="btn2 !py-1 text-xs" onClick={()=>{setFin(m);setNotes('')}}>Mark completed</button><button className="chip !text-rose-600" onClick={()=>setCx(m)}>Cancel meeting</button></div>}</div>};
 return <div className="space-y-4"><div className="flex flex-wrap items-center justify-between gap-2"><h2 className="font-bold">Meetings</h2><button className="btn" onClick={()=>setForm(true)}>+ Schedule meeting</button></div>
  <div className="space-y-2"><h3 className="text-sm font-bold">Upcoming</h3>{up.length?up.map(m=><Card key={m.id} m={m}/>):<div className="card text-center text-sm text-slate-400">No upcoming meetings. Schedule one to keep the team in sync.</div>}</div>
  {past.length>0&&<div className="space-y-2"><h3 className="text-sm font-bold">Past, not yet closed</h3>{past.map(m=><Card key={m.id} m={m}/>)}</div>}
  {hist.length>0&&<div className="space-y-2"><h3 className="text-sm font-bold">History</h3>{hist.map(m=><Card key={m.id} m={m}/>)}</div>}
  {form&&<MeetForm post={post} onClose={()=>setForm(false)}/>}

  {fin&&<Modal title={'Complete: '+fin.title} onClose={()=>setFin(null)}><F l="Notes or decisions (optional)"><textarea className="inp" rows="3" value={notes} onChange={e=>setNotes(e.target.value)}/></F><div className="mt-3 flex justify-end gap-2"><button className="btn2" onClick={()=>setFin(null)}>Back</button><button className="btn" onClick={()=>{A.setMeet(fin.id,{status:'completed',notes:notes.trim()});setFin(null);A.say('Meeting marked completed')}}>Mark completed</button></div></Modal>}</div>}

function WProg({post,setTab}){const A=useA();const me=A.user;const lead=post.authorId===me.id;const [t,setT]=useState('');const tk=post.tasks||[];const rm=post.roadmap;const done=tk.filter(x=>x.status==='done').length;const tp=tk.length?Math.round(done/tk.length*100):0;
 const ms=rm?rm.map((s,i)=>({...s,n:i+1})).filter(s=>s.milestone||s.deadline):[];const up=(post.updates||[]).slice().sort((a,b)=>b.at.localeCompare(a.at));const t0=todayS();
 const post_=()=>{if(t.trim().length<5){A.say('Write a short update (5+ characters).','err');return}A.addUpdate(post.id,t.trim());setT('');A.say('Progress update posted')};

  {rm?<p className="text-xs text-slate-500">{rm.filter(s=>s.status==='done').length} of 13 roadmap stages done. Progress is calculated from the Roadmap tab, so it matches the Feed, Discover Projects and your dashboard.</p>:<p className="text-sm text-slate-500">Create a roadmap to track progress. <button className="font-semibold text-indigo-700 underline" onClick={()=>setTab('roadmap')}>Open Roadmap</button></p>}
  <div className="mt-3"><div className="mb-1 flex justify-between text-xs font-semibold"><span>Tasks completed</span><span>{done}/{tk.length}</span></div><Bar v={tp}/></div></div>

 return <div className="space-y-4"><div className="card"><div className="flex items-center justify-between"><h2 className="font-bold">End-to-end journey check{me.role==='student'?' for '+me.name.split(' ')[0]:''}</h2><span className="chip on">{me.role==='student'?n+' / 16':'Student only'}</span></div><p className="my-2 text-xs text-slate-500">Read live from the shared data, not simulated. Follow the steps with two demo students (Meera and Aarav) and a mentor, then re-check here.</p>{me.role==='student'&&<ol className="space-y-1 text-sm">{steps.map(([l,ok],i)=><li key={i} className="flex gap-2"><span className={ok?'text-emerald-600':'text-slate-300'}>{ok?'✔':'○'}</span>{i+1}. {l}</li>)}</ol>}</div>
 <div className="card"><div className="flex items-center justify-between"><h2 className="font-bold">Data integrity check</h2><button className="btn2" onClick={()=>setRun(integrity(A))}>Run check</button></div>{run&&(run.length?<ul className="mt-2 list-disc pl-5 text-sm text-rose-700">{run.map(x=><li key={x}>{x}</li>)}</ul>:<p className="mt-2 text-sm text-emerald-700">✔ No broken links between users, projects, teams, mentorships, meetings or spotlights.</p>)}</div></div>}
function ReportModal({type,id,onClose}){const A=useA();const [r,setR]=useState('');return <Modal title="Report this post" onClose={onClose}><p className="mb-2 text-sm text-slate-500">Reports go to platform admins for review.</p><F l="What is wrong?"><textarea className="inp" rows="3" value={r} onChange={e=>setR(e.target.value)}/></F><div className="mt-3 flex justify-end gap-2"><button className="btn2" onClick={onClose}>Cancel</button><button className="btn" onClick={()=>{if(r.trim().length<10){A.say('Please add a short reason (10+ characters).','err');return}A.report(type,id,r.trim());A.say('Report sent to admins');onClose()}}>Send report</button></div></Modal>}
const PAGES={messages:Messages,notifications:Notifs,opportunities:Opps,'c-projects':CProjects,'c-teams':CTeams,'c-ideas':CIdeas,'c-spotlight':CSpot,'c-mentors':CMentors,'c-analytics':CAnalytics,'a-users':AUsers,'a-inst':AInst,'a-verify':AVerify,'a-posts':APosts,'a-reports':AReports,'a-analytics':AAnalytics};

function Shell({page}){const A=useA();const u=A.user;const nav=NAV[u.role];const [menu,setMenu]=useState(false);const [lo,setLo]=useState(false);
 const unread=A.s.notifications.filter(n=>n.userId===u.id&&!n.read).length;
 useEffect(()=>{A.remind()},[u.id,(A.s.meetings||[]).length]);const item=nav.find(n=>n[0]===page)||(page==='tracker'?['tracker','Build Tracker','🧾',1,'']:nav[0]);
 const L=({n,cls=''})=><button onClick={()=>{go('/app/'+n[0]);setMenu(false)}} className={'flex w-full items-center gap-3 rounded-xl px-3 py-2 text-left text-sm font-semibold transition '+(item[0]===n[0]?'bg-indigo-600 text-white shadow-sm':'text-slate-600 hover:bg-indigo-50')+' '+cls}><span>{n[2]}</span><span className="flex-1">{n[1]}</span>{n[0]==='notifications'&&unread>0&&<span className="rounded-full bg-violet-500 px-2 text-[11px] text-white">{unread}</span>}</button>;
 const Side=()=><div className="flex h-full flex-col gap-1 p-4"><div className="mb-4 px-2 text-xl font-extrabold text-indigo-700">Skill<span className="text-violet-500">Sync</span></div>{nav.map(n=><L key={n[0]} n={n}/>)}<L n={['tracker','Build Tracker','🧾']}/><div className="mt-auto rounded-xl bg-slate-50 p-3 text-xs text-slate-500"><b className="text-slate-700">{u.name}</b><div>{RL[u.role]}</div><button className="mt-1 font-semibold text-indigo-700" onClick={()=>setLo(true)}>Log out</button></div></div>;
 let body;if(page==='tracker')body=<Tracker/>;else if(item[0]==='dashboard')body=<Dash/>;else if(item[0]==='profile')body=<Profile/>;else if(item[0]==='feed')body=<Feed/>;else if(item[0]==='mentors')body=<Mentors/>;else if(item[0]==='m-requests')body=<MentorWork/>;else if(item[0]==='people')body=<People/>;else if(item[0]==='teams')body=<Teams/>;else if(item[0]==='workspace')body=<Workspace/>;else if(item[0]==='projects')body=<Projects/>;else if(item[0]==='settings')body=<Settings/>;else if(PAGES[item[0]]){const C=PAGES[item[0]];body=<C/>}else body=<Pending item={item}/>;
 return <div className="min-h-screen"><aside className="fixed inset-y-0 left-0 hidden w-64 border-r border-slate-100 bg-white md:block"><Side/></aside>
 <div className="md:pl-64"><header className="sticky top-0 z-20 flex items-center gap-3 border-b border-slate-100 bg-white/90 px-4 py-3 backdrop-blur"><button className="text-xl md:hidden" aria-label="Menu" onClick={()=>setMenu(true)}>☰</button>{u.role==='student'?<Search/>:<span className="font-bold">{item[1]}</span>}<div className="ml-auto flex items-center gap-2"><Sim t="Prototype"/>{(u.role==='student'||u.role==='mentor')&&<button aria-label="Notifications" className="relative text-xl" onClick={()=>go('/app/notifications')}>🔔{unread>0&&<span className="absolute -right-1 -top-1 h-2.5 w-2.5 rounded-full bg-violet-500"/>}</button>}</div></header>
 <main className="p-4 pb-24 sm:p-6 md:pb-8">{body}</main></div>
 <nav className="fixed inset-x-0 bottom-0 z-20 flex border-t border-slate-100 bg-white md:hidden">{nav.slice(0,4).map(n=><button key={n[0]} onClick={()=>go('/app/'+n[0])} className={'flex-1 py-2 text-center text-[11px] font-semibold '+(item[0]===n[0]?'text-indigo-700':'text-slate-400')}><div className="text-lg">{n[2]}</div>{n[1].split(' ')[0]}</button>)}<button onClick={()=>setMenu(true)} className="flex-1 py-2 text-center text-[11px] font-semibold text-slate-400"><div className="text-lg">☰</div>More</button></nav>
 {menu&&<div className="fixed inset-0 z-40 bg-slate-900/50 md:hidden" onClick={()=>setMenu(false)}><div className="h-full w-72 bg-white" onClick={e=>e.stopPropagation()}><Side/></div></div>}
 {lo&&<Confirm title="Log out?" text="You can sign back in any time. Your data stays in this browser." onNo={()=>setLo(false)} onYes={()=>{setLo(false);A.logout();go('/')}}/>}</div>}

function App(){const A=useA();const h=useHash();const inApp=h.startsWith('/app');
 useEffect(()=>{if(inApp&&!A.user)go('/login')},[inApp,A.user]);
 if(inApp)return A.user?<Shell page={h.split('/')[2]||'dashboard'}/>:null;
 if(h==='/roles')return <Roles/>;if(h==='/login')return <Login/>;if(h==='/register')return <Register/>;return <Landing/>}
ReactDOM.createRoot(document.getElementById('root')).render(<Provider><App/></Provider>);
</script></body></html>
